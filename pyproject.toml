[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-severity-control"
version = "0.1.0"
description = "Conformal calibration of severity-controlled multi-label prediction sets."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Yu Gu"},
    {name = "Zijun Yu"},
    {name = "Chi-Kuang Yeh"},
    {name = "Xinyu Wang"},
    {name = "Ziyang Song"},
]
dependencies = ["numpy>=1.23.5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
csc = "csc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
